<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-1000 -1000 2000 2000" overflow="visible">
  <!-- 24 dashes centred on every 15 deg from the top; the red casing is
       1.8 longer per dash (offset by half) so it wraps the dash ends too. -->
  <g transform="rotate(-92.6250)" fill="none" stroke-linecap="butt">
    <circle cx="0" cy="0" r="208" stroke="#D01818" stroke-width="4.2" stroke-dasharray="20.859 33.595" stroke-dashoffset="0.900" />
    <circle cx="0" cy="0" r="208" stroke="#000000" stroke-width="2.4" stroke-dasharray="19.059 35.395" />
  </g>
</svg>
